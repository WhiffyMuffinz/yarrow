services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: yarrow_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yarrow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yarrow_password}
      POSTGRES_DB: ${POSTGRES_DB:-yarrow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-yarrow} -d ${POSTGRES_DB:-yarrow}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  valkey:
    image: valkey/valkey:7-alpine@sha256:c6c2f0020be34bbf684a53a0ef716ab16ff70295186d4d9f2518435beb7afbff
    container_name: yarrow_valkey
    # Append-only log, synced every second, so logouts (revoked tokens,
    # US-19) survive a crash. The default snapshots alone could lose minutes
    # of revocations, letting logged-out tokens work again after a restart.
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: yarrow_minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  create-bucket:
    image: quay.io/minio/mc:latest
    container_name: yarrow_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    # "mc alias set", not "mc config host add": current mc images removed the
    # latter, so the alias was never defined and "mc mb myminio/..." quietly
    # made a local folder instead of the bucket, which broke every upload.
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/yarrow-documents --ignore-existing;
      /usr/bin/mc anonymous set public myminio/yarrow-documents;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    container_name: yarrow_mailpit
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: yarrow_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./packages:/app/packages
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-yarrow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-yarrow_password}
      - POSTGRES_DB=${POSTGRES_DB:-yarrow}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-yarrow-documents}
      - USE_LOCAL_STORAGE=false
      - SECRET_KEY=${SECRET_KEY:-supersecretkey_please_change_in_production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - ENFORCE_HTTPS=${ENFORCE_HTTPS:-false}
      # Addresses of the TLS-terminating proxy that uvicorn trusts to report
      # the original https scheme. Must be set when ENFORCE_HTTPS is on behind
      # a proxy, or every request looks like http and redirects forever.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      - LOG_EMAIL_BODIES=${LOG_EMAIL_BODIES:-false}
      # Where the frontend is reachable, used to build links in emails.
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-false}
      - EMAIL_FROM=${EMAIL_FROM:-Yarrow <no-reply@yarrow.local>}
      - VERIFICATION_CODE_TTL_MINUTES=${VERIFICATION_CODE_TTL_MINUTES:-15}
      - VERIFICATION_MAX_ATTEMPTS=${VERIFICATION_MAX_ATTEMPTS:-5}
      - VERIFICATION_RESEND_COOLDOWN_SECONDS=${VERIFICATION_RESEND_COOLDOWN_SECONDS:-60}
      - VERIFICATION_MAX_SENDS_PER_HOUR=${VERIFICATION_MAX_SENDS_PER_HOUR:-5}
      - PASSWORD_RESET_TTL_MINUTES=${PASSWORD_RESET_TTL_MINUTES:-30}
      - PASSWORD_RESET_COOLDOWN_SECONDS=${PASSWORD_RESET_COOLDOWN_SECONDS:-60}
      - PASSWORD_RESET_MAX_PER_HOUR=${PASSWORD_RESET_MAX_PER_HOUR:-3}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: yarrow_worker
    volumes:
      - ./worker:/app/worker
      - ./packages:/app/packages
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-yarrow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-yarrow_password}
      - POSTGRES_DB=${POSTGRES_DB:-yarrow}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-yarrow-documents}
      - INFERENCE_SERVICE_URL=${INFERENCE_SERVICE_URL}
      - INFERENCE_API_KEY=${INFERENCE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=info
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yarrow_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
  valkey_data:
  minio_data: