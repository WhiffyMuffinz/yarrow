# Dev services for the Yarrow devcontainer.
# Keep in sync with the service definitions in ../docker-compose.yml.
# Project name and container names use the yarrow_dev prefix so this never
# collides with the root compose project, even when both are present on the
# host (container_name is global across projects).
name: yarrow_dev

services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/python:1-3.11-bookworm
    container_name: yarrow_devcontainer
    user: "vscode"
    working_dir: /workspace
    volumes:
      - ../:/workspace
    command: sleep infinity
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: yarrow_dev_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yarrow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yarrow_password}
      POSTGRES_DB: ${POSTGRES_DB:-yarrow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-yarrow} -d ${POSTGRES_DB:-yarrow}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  valkey:
    image: valkey/valkey:7-alpine
    container_name: yarrow_dev_valkey
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: yarrow_dev_rustfs
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_OBS_LOG_DIRECTORY: /app/logs
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data/rustfs0
      - rustfs_logs:/app/logs
    depends_on:
      rustfs-volumes:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rustfs-volumes:
    image: alpine:3.22
    container_name: yarrow_dev_rustfs_volumes
    command: sh -c "chown -R 10001:10001 /data /logs"
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    restart: "no"

  create-bucket:
    image: rclone/rclone:1.75
    container_name: yarrow_dev_s3_setup
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        rclone config create rustfs s3 provider Minio access_key_id ${S3_ACCESS_KEY:-rustfsadmin} secret_access_key ${S3_SECRET_KEY:-rustfsadmin} endpoint http://rustfs:9000
        && rclone mkdir rustfs:${S3_BUCKET_NAME:-yarrow-documents}

  set-bucket-policy:
    image: amazon/aws-cli:2.36.50
    container_name: yarrow_dev_s3_policy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      create-bucket:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - >-
        aws configure set default.s3.addressing_style path
        && aws s3api put-bucket-policy --endpoint-url http://rustfs:9000 --bucket ${S3_BUCKET_NAME:-yarrow-documents} --policy '{"Version": "2012-10-17", "Statement": [{"Effect": "Allow", "Principal": {"AWS": ["*"]}, "Action": ["s3:ListBucket"], "Resource": ["arn:aws:s3:::${S3_BUCKET_NAME:-yarrow-documents}"]}, {"Effect": "Allow", "Principal": {"AWS": ["*"]}, "Action": ["s3:GetObject"], "Resource": ["arn:aws:s3:::${S3_BUCKET_NAME:-yarrow-documents}/*"]}]}'

volumes:
  pg_data:
  valkey_data:
  rustfs_data:
  rustfs_logs:
