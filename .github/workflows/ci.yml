name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: yarrow
          POSTGRES_PASSWORD: yarrow_password
          POSTGRES_DB: yarrow
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:7@sha256:1bbb912679bea3ec2c1b21af3860beb4397774e9118eddad4ae50d8e97fabb99
        ports:
          - 6379

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          pip install poetry==1.8.5
          cd backend
          poetry config virtualenvs.create false
          poetry install
      - name: Lint and Format Check
        run: |
          cd backend
          ruff check .
      - name: Run Tests
        env:
          POSTGRES_USER: yarrow
          POSTGRES_PASSWORD: yarrow_password
          POSTGRES_DB: yarrow
          POSTGRES_HOST: localhost
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          VALKEY_HOST: localhost
          VALKEY_PORT: ${{ job.services.valkey.ports[6379] }}
        run: |
          cd backend
          pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Setup Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: |
          cd frontend
          npm install
      - name: Lint and Format Check
        run: |
          cd frontend
          npm run lint
          npx prettier --check .
      - name: Type Check
        run: |
          cd frontend
          npx tsc --noEmit
      - name: Build
        run: |
          cd frontend
          npm run build
