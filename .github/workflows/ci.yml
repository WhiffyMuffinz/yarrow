name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: yarrow
          POSTGRES_PASSWORD: yarrow_password
          POSTGRES_DB: yarrow
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
        ports:
          - 6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install poetry==2.5.1
          cd backend
          poetry config virtualenvs.create false
          poetry install
      - name: Lint and Format Check
        run: |
          cd backend
          ruff check .
      - name: Run Tests
        env:
          POSTGRES_USER: yarrow
          POSTGRES_PASSWORD: yarrow_password
          POSTGRES_DB: yarrow
          POSTGRES_HOST: localhost
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          VALKEY_HOST: localhost
          VALKEY_PORT: ${{ job.services.valkey.ports[6379] }}
        run: |
          cd backend
          pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: |
          cd frontend
          npm install
      - name: Lint and Format Check
        run: |
          cd frontend
          npm run lint
          npx prettier --check .
      - name: Type Check
        run: |
          cd frontend
          npx tsc --noEmit
      - name: Build
        run: |
          cd frontend
          npm run build
